upstream django {
    server app:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://django/api/health/;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    http2 on;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           no-referrer-when-downgrade always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Static files (served directly by nginx) ───────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Grafana (proxied with sub-path) ───────────────────────────────────
    location /grafana/ {
        allow 10.0.0.0/8;    # VPC only — adjust to your trusted IP range
        allow 127.0.0.1;
        deny all;

        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus (internal only) ────────────────────────────────────────
    location /prometheus/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }

    # ── Metrics endpoint (scraped by Prometheus only) ─────────────────────
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker bridge network
        deny all;

        proxy_pass http://django/metrics;
    }

    # ── Health probes (public, for ALB target group) ──────────────────────
    location /api/health/ {
        proxy_pass http://django;
        access_log off;
    }

    location /api/ready/ {
        proxy_pass http://django;
        access_log off;
    }

    # ── Application ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
