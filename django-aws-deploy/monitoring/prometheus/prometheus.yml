global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: production
    project:     django-app

# Load alert rules
rule_files:
  - "rules/node_alerts.yml"
  - "rules/django_alerts.yml"

# Alertmanager endpoints
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── Host metrics via Node Exporter ──────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["localhost:9100"]  # node-exporter runs with network_mode:host
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: ec2-primary

  # ── Django application metrics ───────────────────────────────────────────
  - job_name: django-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: django-app

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Alertmanager self-monitoring ─────────────────────────────────────────
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
